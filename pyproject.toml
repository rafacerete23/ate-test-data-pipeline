[project]
name = "ate-test-data-pipeline"
version = "0.1.0"
description = "From ATE test data (STDF) to yield analytics: a hands-on data engineering learning project"
requires-python = ">=3.10"
dependencies = [
    "pystdf>=1.4.0",
    "pandas>=2.0",
    "pyarrow>=14",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

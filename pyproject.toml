[project]
name = "ate-test-data-pipeline"
version = "0.1.0"
description = "From ATE test data (STDF) to yield analytics: a hands-on data engineering learning project"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
dependencies = [
    "pystdf>=1.4.0",
    "pandas>=2.0",
    "pyarrow>=14",
    "numpy>=1.24",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7", "scipy>=1.10", "statsmodels>=0.14"]
dev = ["pytest>=7", "ate-test-data-pipeline[analysis]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
